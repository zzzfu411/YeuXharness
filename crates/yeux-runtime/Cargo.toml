[package]
name = "yeux-runtime"
version = "0.1.0-alpha.1"
edition = "2021"
license = "Apache-2.0"
description = "Local runtime adapters for YeuX Harness"

[dependencies]
async-trait = "0.1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustix = { version = "1", features = ["fs", "process"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v7"] }
walkdir = "2"
yeux-protocol = { path = "../yeux-protocol" }
yeux-core = { path = "../yeux-core" }

[dev-dependencies]
httpmock = "0.7"

[lints.rust]
unsafe_code = "forbid"
