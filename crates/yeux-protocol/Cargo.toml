[package]
name = "yeux-protocol"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Versioned wire types for YeuX Harness"

[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["clock", "serde", "std"] }
schemars = { version = "0.8.21", features = ["chrono", "uuid1"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
uuid = { version = "1.11.0", features = ["serde", "v7"] }

[dev-dependencies]
serde_json = "1.0.128"

