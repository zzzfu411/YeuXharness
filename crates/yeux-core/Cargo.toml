[package]
name = "yeux-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Pure state machines, policy, and replay semantics for YeuX Harness"

[dependencies]
async-trait = "0.1.83"
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }
hex = "0.4.3"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
sha2 = "0.10.8"
thiserror = "1.0.64"
uuid = { version = "1.11.0", features = ["v7"] }
yeux-protocol = { path = "../yeux-protocol" }

[dev-dependencies]
futures = "0.3.31"

