[package]
name = "yeuxd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Authoritative local daemon for YeuX Harness"

[lib]
name = "yeuxd"
path = "src/lib.rs"

[[bin]]
name = "yeuxd"
path = "src/main.rs"

[dependencies]
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
fs2 = "0.4"
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v7"] }
url = "2"
yeux-core = { path = "../yeux-core" }
yeux-protocol = { path = "../yeux-protocol" }
yeux-runtime = { path = "../yeux-runtime" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
